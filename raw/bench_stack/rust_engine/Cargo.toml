[package]
name = "lineageq_sas"
version = "0.1.0"
edition = "2021"
description = "exp_42: interprets the SAS pyDSL (out/spec/sas.json) — tokenise, fold to node/4, print back, emit PySpark"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
